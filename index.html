<style>
:root{color-scheme:light dark;--bg:#F3F5FB;--surface:#fff;--ink:#0B1530;--mut:#66728A;--line:#E4E9F4;--brand:#2455F4;--brand2:#5B7CFF;--tint:#E8EEFF;--sun:#FFB020;--bad:#D92D3A;--g:var(--brand);--sh:0 1px 2px rgba(11,21,48,.05),0 10px 28px rgba(11,21,48,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0A0F1F;--surface:#121A33;--ink:#EEF2FF;--mut:#97A3C2;--line:#1F2A4A;--tint:#1A2650;--brand:#5B7CFF;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:112px;background:radial-gradient(900px 380px at 50% -140px,#cfdcff55,transparent),var(--bg);-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:20px 16px}
h1{font-size:1.75rem;letter-spacing:-.025em;margin:6px 0 16px;font-weight:800;line-height:1.15}
h2{font-size:1.05rem;margin:26px 0 10px;font-weight:800;letter-spacing:-.01em}
a{color:var(--brand)}
.hello{margin:4px 0 12px;font-size:1.1rem;font-weight:700;color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;display:block;color:inherit;text-decoration:none;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
a.card:active{transform:scale(.985)}
.hero{position:relative;overflow:hidden;border:0;border-radius:28px;padding:24px;color:#fff;background:linear-gradient(135deg,#1738C9,#2455F4 55%,#6D8BFF);box-shadow:0 18px 40px rgba(36,85,244,.35)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#ffffff40,transparent 70%)}
.hero small{opacity:.85;font-weight:600}.hero b{display:block;font-size:2.5rem;font-weight:800;letter-spacing:-.03em;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.pill{background:#ffffff2e;color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
.stat b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:.9rem}
label{display:block;font-weight:600;font-size:.85rem;color:var(--mut)}
input,textarea,select{font:inherit;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin:6px 0 14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px #2455F428}
button,.btn{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:12px 18px;margin:4px 8px 4px 0;cursor:pointer;display:inline-block;text-decoration:none;box-shadow:0 8px 18px rgba(36,85,244,.28);text-align:center}
button.full,.btn.full{display:block;width:100%;margin:6px 0}
button.alt{background:var(--surface);color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
button.bad{background:var(--bad);box-shadow:none}
button:disabled{opacity:.55}

.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--brand);margin-right:6px}
.tag.s{background:#FFF1D1;color:#8A5A00}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}

.ico{width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--brand);display:grid;place-items:center;margin-bottom:10px}
.ico svg,nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile p{margin:4px 0 0}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(11,21,48,.18)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:20px;color:var(--mut);text-decoration:none;font-size:.7rem;font-weight:700}
nav a.on{background:var(--tint);color:var(--brand)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;z-index:9;max-width:92%;display:none;font-weight:600;box-shadow:var(--sh)}
.auth{padding-top:8vh;text-align:center}.auth form{text-align:left}
.logo{width:68px;height:68px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-size:2rem;font-weight:800;background:linear-gradient(135deg,#1738C9,#6D8BFF);box-shadow:0 14px 30px rgba(36,85,244,.4)}
[hidden]{display:none!important}
@media(min-width:900px){main{max-width:720px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.btn.alt{background:var(--surface);color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.chips{display:flex;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.chips .btn{white-space:nowrap}
.action{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;font-weight:600;font-size:.88rem}
.action .ico{margin:0;width:36px;height:36px;flex:none}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;margin:16px 0}.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.col{flex:1;width:100%;display:flex;align-items:flex-end;gap:3px}.col i{flex:1;border-radius:6px 6px 0 0;min-height:2px}
.bg{background:var(--brand)}.bs{background:var(--sun)}.bar span{font-size:.75rem;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 6px 0 10px}
nav a.x{display:none}
@media(min-width:900px){
 body{padding-bottom:24px;padding-left:272px}
 nav{left:16px;right:auto;top:16px;bottom:auto;width:238px;max-width:none;margin:0;flex-direction:column;padding:10px;border-radius:24px}
 nav a{flex-direction:row;gap:12px;padding:12px 14px;font-size:.95rem}
 nav a.x{display:flex}
 main{max-width:860px}
}
.sub{font-size:.78rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.grid3{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}.grid3 .card{margin:0}
@media(min-width:700px){.grid3{grid-template-columns:repeat(3,1fr)}}
.dim{border-top:4px solid var(--brand)}.dim.r{border-top-color:var(--sun)}.dim.g{border-top-color:#12A150}
.dim p{margin:6px 0 0}

/* ===== CENTRALE ===== */
.ct-banner{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:#FFF6DD;color:#7A5300;font-size:.78rem;font-weight:700;margin:0 0 12px;border:1px solid #FFE4A3}
@media(prefers-color-scheme:dark){.ct-banner{background:#2A2210;color:#FFD98A;border-color:#4A3B12}}
.ct-banner svg{width:16px;height:16px;flex:none}
.ct-search{display:flex;gap:8px;margin:0 0 10px}
.ct-search input{margin:0;flex:1}
.ct-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.ct-cats button{white-space:nowrap;padding:8px 14px;font-size:.85rem;margin:0}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.ct-grid{grid-template-columns:repeat(3,1fr)}}
.ct-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .15s}
.ct-card:active{transform:scale(.985)}
.ct-card .ct-img{aspect-ratio:4/3;background:linear-gradient(135deg,#dfe8ff,#f3f6ff);display:grid;place-items:center;color:var(--brand);font-weight:800;font-size:.9rem;overflow:hidden}
.ct-card .ct-img img{width:100%;height:100%;object-fit:cover;display:block}
.ct-card .ct-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ct-card .ct-name{font-weight:800;font-size:.92rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ct-card .ct-price{font-weight:800;font-size:.98rem;font-variant-numeric:tabular-nums}
.ct-card .ct-com,.ct-com{font-size:.78rem;font-weight:700;color:#8A5A00}
@media(prefers-color-scheme:dark){.ct-card .ct-com,.ct-com{color:#FFD98A}}
.ct-badges{display:flex;gap:6px;flex-wrap:wrap}
.ct-cert{background:#E7F7EE;color:#0E6B3A}
@media(prefers-color-scheme:dark){.ct-cert{background:#0E2E1C;color:#8FE7B8}}
.ct-empty{text-align:center;padding:28px 16px;color:var(--mut)}
.ct-empty b{color:var(--ink);display:block;margin-bottom:6px}
.ct-loading{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:700px){.ct-loading{grid-template-columns:repeat(3,1fr)}}
.ct-skel{aspect-ratio:3/4;border-radius:18px;background:linear-gradient(100deg,var(--line) 20%,color-mix(in srgb,var(--line) 60%,var(--surface)) 40%,var(--line) 60%);background-size:200% 100%;animation:ct-shimmer 1.2s infinite}
@keyframes ct-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.ct-skel{animation:none}}
.ct-gain{display:inline-block;align-self:flex-start;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:#FFF1D1;color:#8A5A00}
@media(prefers-color-scheme:dark){.ct-gain{background:#2A2210;color:#FFD98A}}
.ct-rate{font-size:.75rem;color:var(--mut)}
.ct-stars{color:var(--sun);letter-spacing:1px}
.ct-steps{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px}
.ct-steps span{flex:1;min-width:104px;font-size:.78rem;font-weight:700;color:var(--mut);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.ct-steps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--tint);color:var(--brand);margin-right:4px;font-size:.72rem}
.ct-steps4 span{min-width:120px}
.ct-prev{margin-top:20px;padding:12px;border:1.5px dashed var(--line);border-radius:16px}
.ct-prev .ct-cats{margin:4px 0 8px}
</style>

<body>
<div id="toast" role="status"></div>
<main id="app"></main>
<nav id="nav" aria-label="Navigation principale" hidden></nav>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

// ===== src/config.js =====
const SUPABASE_URL = 'https://gawppzkswaszrqbsazby.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IPsMYGWKaOGMxLO6I6z_Ng_KqOEOBxj';

// ===== src/constants.js =====
const MODULES = [
  {id:'community', name:'Communauté', icon:'community', desc:'Offres, recherches et mises en relation', status:'ready'},
  {id:'centrale', name:'La Centrale', icon:'store', desc:'Catalogue de produits, revente et commissions', status:'ready'},
  {id:'immobilier', name:'Immobilier', icon:'building', desc:'Terrains, parcelles et logements', status:'ready'},
  {id:'transport', name:'Transport', icon:'truck', desc:'Transport, livraison et déménagement', status:'ready'},
  {id:'dropads', name:'DropAds', icon:'megaphone', desc:'Gagnez de l’argent en partageant des offres ou des services', status:'soon'},
];
const STATUS = {pending:'En attente', approved:'Publiée', rejected:'Refusée', expired:'Expirée', fulfilled:'Satisfaite'};

// ===== src/contexts/state.js =====
const state = {me:null, isAdmin:false, isAmbassador:false, feedTab:'offer'};

// ===== src/utils/format.js =====
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa = n => new Intl.NumberFormat('fr-FR').format(n || 0) + ' FCFA';
const dt = d => new Date(d).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'});
const norm = p => { let d = String(p).replace(/\D/g, ''); if (d.length === 8) d = '226' + d; return d; };
const mail = d => `p${d}@users.dropaffy.app`;

// ===== src/components/ui.js =====
const app = document.getElementById('app');
const nav = document.getElementById('nav');
function toast(m) {
  const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4500);
}
const loading = () => { app.innerHTML = '<p class="card mut" aria-busy="true">Chargement…</p>'; };
const P = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  community:'<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
  contacts:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M16 11l2 2 4-4"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  store:'<path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
  building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/>',
  truck:'<path d="M1 6h13v11H1z"/><path d="M14 10h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  megaphone:'<path d="M3 11v2a1 1 0 0 0 1 1h3l8 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M19 8a5 5 0 0 1 0 8"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h14v-4"/><path d="M21 12h-4a2 2 0 0 0 0 4h4z"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>'};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;
const TABS = [['#/','Accueil','home'],['#/opportunities','Opportunités','compass'],['#/activity','Activité','briefcase'],['#/wallet','Portefeuille','wallet'],
  ['#/centrale','La Centrale','store',1],
  ['#/contacts','Relations','contacts',1],['#/evolution','Évolution','trend',1],['#/notifications','Notifications','bell',1],['#/profile','Profil','profile']];
const ON = {
  '#/': h => h === '#/' || h.startsWith('#/m/'),
  '#/opportunities': h => /^#\/(opportunities|community|centrale|immobilier|transport|product|p\/|publish|seller)/.test(h),
  '#/activity': h => h.startsWith('#/activity'), '#/wallet': h => h === '#/wallet', '#/contacts': h => h === '#/contacts',
  '#/evolution': h => h === '#/evolution', '#/notifications': h => h === '#/notifications', '#/profile': h => /^#\/(profile|admin)/.test(h),
  '#/centrale': h => h.startsWith('#/centrale')};
function setNav() {
  const h = location.hash || '#/'; nav.hidden = false;
  nav.innerHTML = TABS.map(([u, l, i, x]) => { const on = ON[u](h);
    return `<a href="${u}" class="${on ? 'on' : ''} ${x ? 'x' : ''}" ${on ? 'aria-current="page"' : ''}>${icon(i)}${l}</a>`; }).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setTimeout(() => { b.disabled = true; }, 0); setTimeout(() => { b.disabled = false; }, 1500);
});

// ===== src/services/supabase.js =====
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
async function q(p) {
  let r; try { r = await p; } catch (e) { toast('Connexion instable. Réessayez.'); throw e; }
  if (r.error) {
    const e = r.error;
    if (e.code === 'PGRST301' || /jwt/i.test(e.message)) { toast('Session expirée : reconnectez-vous.'); await sb.auth.signOut(); }
    else toast(e.message);
    throw e;
  }
  return r.data;
}

// ===== Écrans pas encore disponibles =====
function comingSoon(title, back = '#/') {
  app.innerHTML = `<a href="${back}">← Retour</a><h1>${esc(title)}</h1>
  <div class="card"><span class="tag s">En préparation</span><p class="mut">Cet écran sera activé prochainement.</p></div>`;
}
function product() { comingSoon('Produit', '#/centrale'); }
function immobilier() { comingSoon('Immobilier', '#/opportunities'); }
function transport() { comingSoon('Transport', '#/opportunities'); }
function seller() { comingSoon('Mes fiches et produits', '#/profile'); }
async function adminFinance() {
  const [pos, mo, ex] = await Promise.all([q(sb.rpc('finance_position')), q(sb.rpc('finance_monthly', {p_months:6})), q(sb.from('finance_expenses').select('period,label,amount').order('period', {ascending:false}).limit(10))]);
  const p = (pos || [])[0] || {}, M = mo || [], cur = new Date().toISOString().slice(0, 7);
  const st = (v, l) => `<div class="card stat"><b>${fcfa(v)}</b><span class="mut">${l}</span></div>`;
  app.innerHTML = `<a href="#/admin">← Administration</a><h1>Pilotage financier</h1>
  <div class="grid">${st(p.commissions_dues, 'Commissions dues')}${st(p.soldes_portefeuilles, 'Fonds clients (hors revenus)')}${st(p.reserve_actuelle, 'Réserve actuelle')}${st(p.charges_mensuelles, 'Seuil de survie / mois')}${st(p.fonds_ventes_en_attente, 'Ventes encaissées, à répartir')}${st(p.versements_fournisseurs_dus, 'Versements fournisseurs dus')}${st(p.remboursements_a_effectuer, 'Remboursements clients à faire')}</div>
  <div class="card"><b>Réserve cible</b><p class="mut">1 mois : ${fcfa(p.reserve_cible_1_mois)} · 3 mois : ${fcfa(p.reserve_cible_3_mois)} · 6 mois : ${fcfa(p.reserve_cible_6_mois)}<br>Couverture actuelle : ${p.couverture_mois ?? 0} mois · Objectif de revenus : ${fcfa(p.objectif_revenus)}</p></div>
  <h2>Mois par mois</h2>${M.map(m => { const ended = m.mois.slice(0, 7) < cur, can = ended && Number(m.reserve_suggeree) > 0 && Number(m.reserve_allouee) === 0;
    return `<div class="card"><b>${m.mois.slice(0, 7)}</b> <span class="tag${Number(m.disponible) < 0 ? ' s' : ''}">Disponible ${fcfa(m.disponible)}</span>

async function evolution() {
  const d = await q(sb.rpc('member_dashboard')), S = d.series || [];
  const max = Math.max(1, ...S.flatMap(x => [x.gains, x.spent])), cur = S[S.length - 1] || {gains:0}, prev = S[S.length - 2] || {gains:0};
  const delta = prev.gains > 0 ? Math.round((cur.gains - prev.gains) / prev.gains * 100) : null;
  app.innerHTML = `<h1>Mon évolution</h1><div class="card"><div class="row"><b>6 derniers mois</b>${delta === null ? '' : `<span class="tag">${delta >= 0 ? '+' : ''}${delta} % de gains vs mois dernier</span>`}</div>
  <div class="bars">${S.map(x => `<div class="bar"><div class="col"><i class="bg" style="height:${Math.round(x.gains / max * 100)}%"></i><i class="bs" style="height:${Math.round(x.spent / max * 100)}%"></i></div><span>${x.m.slice(5)}/${x.m.slice(2, 4)}</span></div>`).join('')}</div>
  <p class="mut"><span class="dot bg"></span>Gains<span class="dot bs"></span>Dépenses</p></div>
  <div class="grid"><div class="card stat"><b>${fcfa(d.gains_total)}</b><span class="mut">Gains cumulés</span></div><div class="card stat"><b>${fcfa(d.spent_total)}</b><span class="mut">Dépenses cumulées</span></div>
  <div class="card stat"><b>${fcfa(d.withdrawn)}</b><span class="mut">Retraits payés</span></div><div class="card stat"><b>${d.contacts}</b><span class="mut">Mises en relation</span></div></div>`;
}

  ${can ? `<form id="wf" class="card" style="margin-top:12px"><b>Retirer mes gains</b><p class="mut">Minimum ${fcfa(d.min_withdrawal)}. Votre demande est traitée par l’équipe sur votre numéro Mobile Money.</p>

   <label>Moyen<select name="method"><option value="orange_money">Orange Money</option><option value="moov_money">Moov Money</option></select></label>
   <label>Numéro<input name="phone" type="tel" required></label><button class="full">Demander le retrait</button></form>`
   : `<div class="card" style="margin-top:12px"><b>Retirer mes gains</b><p class="mut">Il vous faut au moins ${fcfa(d.min_withdrawal)} de gains retirables. Vous avez ${fcfa(d.withdrawable)}.</p></div>`}
  ${dueCard(due)}
  ${(wd.data || []).filter(x => x.status === 'pending').map(x => `<div class="card row"><span>Retrait de <b>${fcfa(x.amount)}</b><br><span class="mut">${dt(x.created_at)} · en attente</span></span><button class="alt" data-c="${x.id}">Annuler</button></div>`).join('')}
  <h2>Historique financier</h2><div class="chips">${F.map(([k, l]) => `<button class="${filt === k ? '' : 'alt'}" data-f="${k}">${l}</button>`).join('')}</div>
  ${show.map(r => `<div class="card row"><span>${esc(r.label)}<br><span class="mut">${dt(r.date)} · ${esc(r.st)}</span></span><b>${SG[r.t]}${fcfa(r.amt)}</b></div>`).join('') || '<p class="card mut">Aucune opération.</p>'}`;

    if (!confirm(`Demander le retrait de ${fcfa(Number(v.amount))} sur ${v.phone} ?`)) return;

// ===== src/services/centrale.js =====
const centraleService = (() => {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const avg = id => { const l = DEMO_REVIEWS[id] || []; return l.length ? l.reduce((a, x) => a + x.r, 0) / l.length : 0; };
  async function listProducts({q = '', category = ''} = {}) {
    await wait(180);
    if (!DEMO_MODE) throw new Error('Backend non branché');
    let rows = DEMO_PRODUCTS.slice();
    if (category) rows = rows.filter(r => r.category === category);
    if (q) { const t = q.toLowerCase(); rows = rows.filter(r => r.title.toLowerCase().includes(t) || r.description.toLowerCase().includes(t)); }
    rows.sort((a, b) => (b.certified ? 1 : 0) - (a.certified ? 1 : 0));
    return rows.map(r => ({...r, rating:avg(r.id), reviews:(DEMO_REVIEWS[r.id] || []).length}));
  }
  async function listCategories() { await wait(60); return DEMO_CATEGORIES.slice(); }
  async function getProduct(id) {
    await wait(80); const p = DEMO_PRODUCTS.find(x => x.id === id);
    return p ? {...p, rating:avg(id), reviews:(DEMO_REVIEWS[id] || []).length} : null;
  }
  async function listReviews(id) { await wait(60); return (DEMO_REVIEWS[id] || []).slice(); }
  // Démo : l'avis n'est conservé que dans cette session (aucun enregistrement serveur)
  async function addReview(id, r, t) { (DEMO_REVIEWS[id] = DEMO_REVIEWS[id] || []).unshift({n:'Vous', r, t, d:new Date().toISOString().slice(0, 10)}); }
  return { listProducts, listCategories, getProduct, listReviews, addReview };
})();

const ctStars = r => { const n = Math.round(r); return '★'.repeat(n) + '☆'.repeat(5 - n); };

function ctCardProduct(p) {

  return `<a class="ct-card" href="#/centrale/p/${encodeURIComponent(p.id)}" aria-label="${esc(p.title)}">

const ctLoading = () => `<div class="ct-loading">${'<div class="ct-skel"></div>'.repeat(6)}</div>`;

let ctState = {q:'', cat:''};

  app.innerHTML = `<h1 style="margin-bottom:4px">La Centrale</h1>

    cats.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { ctState.cat = b.dataset.cat; renderCats(); renderList(); });

    list.innerHTML = ctLoading();

    } catch (_) {

// ===== src/main.js =====
const ROUTES = {'':home, opportunities, community, publish, contacts, activity:activities, notifications, evolution, wallet, profile,
  admin:a => a === 'centrale' ? adminCentrale() : a === 'finance' ? adminFinance() : admin(), p:detail, m:soon, centrale:centraleRoot, product, immobilier, transport, seller};

async function centraleRoot(a, b) {
  if (!a) return catalogue();
  if (a === 'p') return centraleProduct(b);
  if (a === 'mes-recos') return comingSoonCt('Mes recommandations', 'Le suivi des ventes et des commissions sera activé avec le backend La Centrale.');
  if (a === 'ambassadeur') return comingSoonCt('Espace ambassadeur', 'La gestion des offres sera activée avec le backend La Centrale.');
  if (a === 'admin') return comingSoonCt('Administration La Centrale', 'La file de validation et de certification sera activée avec le backend La Centrale.');
  return catalogue();
}
function comingSoonCt(title, text) {
  app.innerHTML = `<a href="#/centrale">← La Centrale</a>${ctBanner()}<h1>${esc(title)}</h1>
    <div class="card"><span class="tag s">En préparation</span><p class="mut">${esc(text)}</p></div>`;
}

async function route() {
  if (!state.me) return authView(boot);
  setNav();
  const [, k = '', a, b] = (location.hash || '#/').split('/');
  if (k === 'admin' && !state.isAdmin) { app.innerHTML = '<p class="card">Accès refusé : réservé aux administrateurs.</p>'; return; }
  const fn = ROUTES[k];
  if (!fn) { app.innerHTML = '<p class="card">Page introuvable.</p>'; return; }
  loading();
  try { await fn(a, b); }
  catch (_) { app.innerHTML = '<p class="card">Impossible de charger cet écran. Vérifiez votre connexion puis réessayez.</p>'; }
}
async function boot() { const s = await loadSession(); state.me = s.user; state.isAdmin = s.admin; state.isAmbassador = s.amb; route(); }

window.addEventListener('hashchange', route);
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.me = null; state.isAdmin = false; state.isAmbassador = false; route(); } });
boot();
</script>
