<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1553B6">
<title>DropAffy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#F3F5FB;--surface:#fff;--ink:#0B1530;--mut:#66728A;--line:#E4E9F4;--brand:#2455F4;--brand2:#5B7CFF;--tint:#E8EEFF;--sun:#FFB020;--bad:#D92D3A;--g:var(--brand);--sh:0 1px 2px rgba(11,21,48,.05),0 10px 28px rgba(11,21,48,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0A0F1F;--surface:#121A33;--ink:#EEF2FF;--mut:#97A3C2;--line:#1F2A4A;--tint:#1A2650;--brand:#5B7CFF;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:112px;background:radial-gradient(900px 380px at 50% -140px,#cfdcff55,transparent),var(--bg);-webkit-font-smoothing:antialiased}
main{max-width:600px;margin:0 auto;padding:20px 16px}
h1{font-size:1.75rem;letter-spacing:-.025em;margin:6px 0 16px;font-weight:800;line-height:1.15}
h2{font-size:1.05rem;margin:26px 0 10px;font-weight:800;letter-spacing:-.01em}
a{color:var(--brand)}
.hello{margin:4px 0 12px;font-size:1.1rem;font-weight:700;color:var(--mut)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;display:block;color:inherit;text-decoration:none;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
a.card:active{transform:scale(.985)}
.hero{position:relative;overflow:hidden;border:0;border-radius:28px;padding:24px;color:#fff;background:linear-gradient(135deg,#1738C9,#2455F4 55%,#6D8BFF);box-shadow:0 18px 40px rgba(36,85,244,.35)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#ffffff40,transparent 70%)}
.hero small{opacity:.85;font-weight:600}.hero b{display:block;font-size:2.5rem;font-weight:800;letter-spacing:-.03em;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.pill{background:#ffffff2e;color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:99px;backdrop-filter:blur(6px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
.stat b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.mut{color:var(--mut);font-size:.9rem}
label{display:block;font-weight:600;font-size:.85rem;color:var(--mut)}
input,textarea,select{font:inherit;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin:6px 0 14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px #2455F428}
button,.btn{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:12px 18px;margin:4px 8px 4px 0;cursor:pointer;display:inline-block;text-decoration:none;box-shadow:0 8px 18px rgba(36,85,244,.28);text-align:center}
button.full,.btn.full{display:block;width:100%;margin:6px 0}
button.alt{background:var(--surface);color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
button.bad{background:var(--bad);box-shadow:none}
button:disabled{opacity:.55}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--brand);margin-right:6px}
.tag.s{background:#FFF1D1;color:#8A5A00}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.unread{border-left:4px solid var(--sun)}
.ico{width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--brand);display:grid;place-items:center;margin-bottom:10px}
.ico svg,nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile p{margin:4px 0 0}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(11,21,48,.18)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:20px;color:var(--mut);text-decoration:none;font-size:.7rem;font-weight:700}
nav a.on{background:var(--tint);color:var(--brand)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;z-index:9;max-width:92%;display:none;font-weight:600;box-shadow:var(--sh)}
.auth{padding-top:8vh;text-align:center}.auth form{text-align:left}
.logo{width:68px;height:68px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-size:2rem;font-weight:800;background:linear-gradient(135deg,#1738C9,#6D8BFF);box-shadow:0 14px 30px rgba(36,85,244,.4)}
[hidden]{display:none!important}
@media(min-width:900px){main{max-width:720px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div id="toast" role="status"></div>
<main id="app"></main>
<nav id="nav" aria-label="Navigation principale" hidden></nav>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
// ===== src/config.js =====
// Clé PUBLIQUE uniquement. Jamais de clé service_role dans le navigateur.
const SUPABASE_URL = 'https://gawppzkswaszrqbsazby.supabase.co';
const SUPABASE_KEY = 'sb_publishable_IPsMYGWKaOGMxLO6I6z_Ng_KqOEOBxj';

// ===== src/constants.js =====
// Modules : seul le statut 'ready' ouvre un écran réel. Rien n'est simulé.
// adminOnly : visible uniquement pour un administrateur (rôle lu côté serveur).
const MODULES = [
  {id:'centrale', name:'La Centrale', icon:'store', desc:'Catalogue, affiliation et commissions', status:'ready'},
  {id:'immobilier', name:'Immobilier', icon:'building', desc:'Terrains, parcelles et logements', status:'ready'},
  {id:'transport', name:'Transport', icon:'truck', desc:'Transport, livraison et déménagement', status:'ready'},
  {id:'dropads', name:'DropAds', icon:'megaphone', desc:'Campagnes publicitaires et diffuseurs', status:'soon'},
  {id:'dropalgo', name:'DropAlgo', icon:'spark', desc:'Aide au rapprochement des besoins et offres', status:'soon', adminOnly:true},
];
const STATUS = {pending:'En attente', approved:'Publiée', rejected:'Refusée', expired:'Expirée', fulfilled:'Satisfaite'};

// ===== src/contexts/state.js =====
const state = {me:null, isAdmin:false, isAmbassador:false, feedTab:'offer'};

// ===== src/utils/format.js =====
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa = n => new Intl.NumberFormat('fr-FR').format(n || 0) + ' FCFA';
const dt = d => new Date(d).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'});
const norm = p => { let d = String(p).replace(/\D/g, ''); if (d.length === 8) d = '226' + d; return d; };
const mail = d => `p${d}@users.dropaffy.app`;

// ===== src/components/ui.js =====
const app = document.getElementById('app');
const nav = document.getElementById('nav');
function toast(m) {
  const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 4500);
}
const loading = () => { app.innerHTML = '<p class="card mut" aria-busy="true">Chargement…</p>'; };
const P = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  community:'<path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
  contacts:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M16 11l2 2 4-4"/>',
  activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  store:'<path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
  building:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/>',
  truck:'<path d="M1 6h13v11H1z"/><path d="M14 10h4l3 3v4h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  megaphone:'<path d="M3 11v2a1 1 0 0 0 1 1h3l8 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M19 8a5 5 0 0 1 0 8"/>',
  spark:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>'};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;
const TABS = [['#/','Accueil','home'],['#/community','Communauté','community'],['#/contacts','Contacts','contacts'],['#/activity','Activité','activity'],['#/profile','Profil','profile']];
const active = (u, h) => u === '#/' ? (h === '#/' || h.startsWith('#/m/') || /^#\/(centrale|immobilier|transport|product|ambassador)/.test(h))
  : h === u || (u === '#/community' && (h.startsWith('#/p/') || h === '#/publish'))
  || (u === '#/activity' && h === '#/wallet') || (u === '#/profile' && h === '#/admin');
function setNav() {
  const h = location.hash || '#/'; nav.hidden = false;
  nav.innerHTML = TABS.map(([u, l, i]) => `<a href="${u}" class="${active(u, h) ? 'on' : ''}" ${active(u, h) ? 'aria-current="page"' : ''}>${icon(i)}${l}</a>`).join('');
}
// Anti double-soumission : un bouton cliqué est désactivé brièvement (paiement, demande, publication).
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  setTimeout(() => { b.disabled = true; }, 0); setTimeout(() => { b.disabled = false; }, 1500);
});

// ===== src/services/supabase.js =====
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
// Résout une requête Supabase ; affiche l'erreur serveur (déjà en français pour les règles métier) et la relance.
async function q(p) {
  let r; try { r = await p; } catch (e) { toast('Connexion instable. Réessayez.'); throw e; }
  if (r.error) {
    const e = r.error;
    if (e.code === 'PGRST301' || /jwt/i.test(e.message)) { toast('Session expirée : reconnectez-vous.'); await sb.auth.signOut(); }
    else toast(e.message);
    throw e;
  }
  return r.data;
}

// ===== src/services/auth.js =====
// L'état admin vient du serveur (is_admin), pas du navigateur.
async function loadSession() {
  const {data} = await sb.auth.getSession(); const user = data.session?.user || null; let admin = false, amb = false;
  if (user) { const r = await sb.rpc('is_admin'); admin = r.data === true; const a = await sb.rpc('is_ambassador'); amb = a.data === true; }
  return {user, admin, amb};
}

// ===== src/pages/auth.js =====
function authView(onDone,mode='login'){
  nav.hidden=true;const reg=mode==='register';
  app.innerHTML=`<div class="auth"><div class="logo">D</div><h1>DropAffy</h1><p class="mut">Besoin ↔ Réseau ↔ Opportunité</p>
  <form id="f" class="card">${reg?'<label>Nom complet<input id="n" required autocomplete="name"></label>':''}
  <label>Numéro de téléphone<input id="p" type="tel" required autocomplete="tel" placeholder="70 12 34 56"></label>
  <label>Mot de passe<input id="w" type="password" required minlength="8" autocomplete="${reg?'new-password':'current-password'}"></label>
  ${reg?'<label>Numéro du parrain (facultatif)<input id="ref" type="tel" placeholder="Numéro de la personne qui vous a invité"></label>':''}
  <button class="full">${reg?'Créer mon compte':'Se connecter'}</button></form>
  <button class="alt full" id="sw">${reg?'J’ai déjà un compte':'Créer un compte'}</button></div>`;
  document.getElementById('sw').onclick=()=>authView(onDone,reg?'login':'register');
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();
    const d=norm(p.value),email=mail(d);
    try{
      if(reg){await q(sb.auth.signUp({email,password:w.value,options:{data:{full_name:n.value.trim(),phone:'+'+d}}}));const rf=document.getElementById('ref');if(rf&&rf.value.trim())await sb.rpc('set_referrer',{p_phone:rf.value})}
      else await q(sb.auth.signInWithPassword({email,password:w.value}));
      onDone();
    }catch(_){}};
}

// ===== src/pages/home.js =====
async function home() {
  const cnt = (t, f) => { const x = sb.from(t).select('*', {count:'exact', head:true}); return f ? f(x) : x; };
  const live = t => cnt(t, x => x.eq('user_id', state.me.id).eq('status', 'approved').gt('expires_at', new Date().toISOString()));
  const [w, qt, mo, ms, rc, ct, nt, po, ps, pf, pp, pt] = await Promise.all([
    sb.from('wallets').select('balance').maybeSingle(), sb.from('contact_quotas').select('credits').maybeSingle(),
    live('offers'), live('searches'),
    cnt('contact_requests', x => x.eq('recipient_id', state.me.id).eq('status', 'pending')), cnt('contacts'),
    cnt('notifications', x => x.eq('is_read', false)),
    state.isAdmin ? cnt('offers', x => x.eq('status', 'pending')) : {count:0},
    state.isAdmin ? cnt('searches', x => x.eq('status', 'pending')) : {count:0},
    sb.from('profiles').select('full_name').eq('id', state.me.id).maybeSingle(),
    state.isAdmin ? cnt('properties', x => x.eq('status', 'pending')) : {count:0},
    state.isAdmin ? cnt('transport_requests', x => x.eq('status', 'pending')) : {count:0}]);
  const todo = (po.count || 0) + (ps.count || 0) + (pp.count || 0) + (pt.count || 0);
  const name = String(pf.data?.full_name || '').split(' ')[0];
  const mods = MODULES.filter(m => !m.adminOnly || state.isAdmin);
  app.innerHTML = `<p class="hello">Bonjour${name ? ', ' + esc(name) : ''} 👋</p>
  <div class="card hero"><small>Solde du portefeuille</small><b>${fcfa(w.data?.balance)}</b>
   <div class="row"><small>${qt.data?.credits ?? 0} mises en relation disponibles</small><a class="pill" href="#/wallet">Détails</a></div></div>
  <div class="grid"><a class="card stat" href="#/community"><b>${(mo.count || 0) + (ms.count || 0)}</b><span class="mut">Publications actives</span></a>
  <a class="card stat" href="#/activity"><b>${rc.count || 0}</b><span class="mut">Demandes à traiter</span></a>
  <a class="card stat" href="#/contacts"><b>${ct.count || 0}</b><span class="mut">Contacts obtenus</span></a>
  <a class="card stat" href="#/activity"><b>${nt.count || 0}</b><span class="mut">Notifications</span></a></div>
  ${state.isAdmin ? `<a class="card row" style="margin-top:12px" href="#/admin"><span><b>${todo}</b> publication(s) à valider</span><span class="tag">Administration</span></a>` : ''}
  <a class="btn full" style="margin-top:14px" href="#/publish">Publier une offre ou une recherche</a>
  <h2>Modules</h2><div class="grid">${mods.map(m => `<a class="card tile" href="#/${m.status === 'ready' ? m.id : 'm/' + m.id}"><div class="ico">${icon(m.icon)}</div><b>${esc(m.name)}</b>
   ${m.status === 'ready' ? '' : '<br><span class="tag s">En préparation</span>'}<p class="mut">${esc(m.desc)}</p></a>`).join('')}</div>`;
}

// ===== src/pages/community.js =====
const SKIND = {product:['La Centrale','#/product/'], property:['Immobilier','#/p/property/'], transport:['Transport','#/p/transport/'], offer:['Communauté','#/p/offer/']};
async function community() {
  const feed = t => sb.from(t).select('*').eq('status', 'approved').order('created_at', {ascending:false}).limit(30);
  const mine = t => sb.from(t).select('id,title,status,expires_at').eq('user_id', state.me.id).order('created_at', {ascending:false}).limit(20);
  const [o, s, mo, ms] = await Promise.all([feed('offers'), feed('searches'), mine('offers'), mine('searches')]);
  const tab = state.feedTab, list = (tab === 'offer' ? o : s).data || [];
  const my = [...(mo.data || []).map(x => ({...x, k:'offer'})), ...(ms.data || []).map(x => ({...x, k:'search'}))];
  app.innerHTML = `<div class="row"><h1>Communauté</h1><a class="btn" href="#/publish">Publier</a></div>
  <form id="sf" class="card"><input id="sq" type="search" minlength="2" maxlength="80" required placeholder="Que cherchez-vous ? Produit, bien, transport, service…"><button class="full">Rechercher</button></form>
  <div id="res"></div><div id="feed">
  <div><button class="${tab === 'offer' ? '' : 'alt'}" data-t="offer">Offres</button><button class="${tab === 'search' ? '' : 'alt'}" data-t="search">Recherches</button></div>
  ${list.map(r => `<a class="card" href="#/p/${tab}/${r.id}"><b>${esc(r.title)}</b><br><span class="tag">${esc(r.category || 'Général')}</span><span class="mut">${esc(r.city || '')}</span>
   <p class="mut" style="margin:6px 0 0">${esc(r.description).slice(0, 110)}</p></a>`).join('') || '<p class="card mut">Aucune publication validée pour le moment. Publiez la première.</p>'}
  <h2>Mes publications</h2>${my.map(x => `<a class="card row" href="#/p/${x.k}/${x.id}"><span>${esc(x.title)}</span><span class="tag s">${esc(STATUS[x.status] || x.status)}</span></a>`).join('') || '<p class="card mut">Vous n’avez rien publié.</p>'}</div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { state.feedTab = b.dataset.t; community(); });
  // Recherche : si La Centrale, Immobilier, Transport ou la Communauté peuvent satisfaire le besoin, on n'affiche que cela ; sinon on propose de créer une recherche.
  document.getElementById('sf').onsubmit = async e => { e.preventDefault();
    const t = document.getElementById('sq').value.trim(), res = document.getElementById('res'), fd = document.getElementById('feed');
    res.innerHTML = '<p class="card mut" aria-busy="true">Recherche…</p>'; fd.hidden = true;
    try {
      const rows = await q(sb.rpc('search_network', {p_q:t}));
      if (!rows.length) res.innerHTML = `<div class="card"><b>Rien ne correspond à « ${esc(t)} ».</b>
        <p class="mut">Ni La Centrale, ni Immobilier, ni Transport, ni la Communauté ne répondent à ce besoin pour le moment. Publiez une recherche : le réseau pourra vous répondre.</p>
        <a class="btn full" href="#/publish/search/${encodeURIComponent(t)}">Créer une recherche</a></div><button class="alt full" id="clr">Effacer la recherche</button>`;
      else res.innerHTML = Object.keys(SKIND).filter(k => rows.some(r => r.kind === k)).map(k => `<h2>${SKIND[k][0]}</h2>` +
        rows.filter(r => r.kind === k).map(r => `<a class="card" href="${SKIND[k][1]}${r.id}"><b>${esc(r.title)}</b><br><span class="tag">${esc(r.subtitle)}</span>
        ${r.price != null ? `<b>${fcfa(r.price)}</b> ` : ''}<span class="mut">${esc(r.city || '')}</span></a>`).join('')).join('') + '<button class="alt full" id="clr">Effacer la recherche</button>';
      document.getElementById('clr').onclick = () => community();
    } catch (_) { res.innerHTML = ''; fd.hidden = false; }
  };
}

// ===== src/pages/publish.js =====
function publish(kind,txt){
  app.innerHTML=`<h1>Publier</h1><form id="f" class="card"><label>Type<select id="t"><option value="offer">Je propose (offre, service)</option><option value="search">Je cherche (fournisseur, prestataire)</option></select></label>
  <label>Titre<input id="ti" required maxlength="120"></label><label>Description<textarea id="d" rows="5" required></textarea></label>
  <label>Catégorie<input id="c" placeholder="Électroménager, transport…"></label><label>Ville<input id="v" placeholder="Ouagadougou"></label>
  <button class="full">Envoyer pour validation</button>
  <p class="mut">Pas d’annonce immobilière, de produit pour La Centrale ni de recherche d’emploi. Une fois validée, la publication reste visible 2 jours.</p></form>`;
  if(kind==='search')document.getElementById('t').value='search';if(txt)document.getElementById('ti').value=decodeURIComponent(txt);
  document.getElementById('f').onsubmit=async e=>{e.preventDefault();
    try{await q(sb.from(t.value==='offer'?'offers':'searches').insert({user_id:state.me.id,title:ti.value.trim(),description:d.value.trim(),category:c.value.trim()||null,city:v.value.trim()||null}));
    toast('Publication envoyée : en attente de validation.');location.hash='#/'}catch(_){}};
}

// ===== src/pages/detail.js =====
const TBL = {offer:'offers', search:'searches', property:'properties', transport:'transport_requests'};
const LBL = {offer:'Offre', search:'Recherche', property:'Immobilier', transport:'Transport'};
const BACK = {offer:'#/community', search:'#/community', property:'#/immobilier', transport:'#/transport'};
async function detail(type, id) {
  if (!TBL[type]) throw new Error('type');
  const r = await q(sb.from(TBL[type]).select('*').eq('id', id).single());
  const mine = r.user_id === state.me.id;
  const facts = [r.category, r.property_type && (r.operation + ' · ' + r.property_type), r.kind && (r.direction + ' · ' + r.kind),
    r.price != null && fcfa(r.price), r.origin && r.destination && (r.origin + ' → ' + r.destination), r.travel_date && ('Date : ' + r.travel_date), r.city, r.district].filter(Boolean);
  app.innerHTML = `<a href="${BACK[type]}">← Retour</a><h1>${esc(r.title)}</h1>

    sb.from('ambassadors').select('*,profiles!ambassadors_user_id_fkey(full_name,phone)'), sb.from('profiles').select('id,full_name,phone').order('created_at', {ascending:false}).limit(200)]);

  <h2>Ambassadeurs (${A.length})</h2>${A.map(x => `<div class="card row"><span><b>${esc(x.profiles?.full_name)}</b><br><span class="mut">${x.paid_until && new Date(x.paid_until) > new Date() ? 'Actif jusqu’au ' + dt(x.paid_until) : 'Abonnement à payer ou expiré'}</span></span>
   <button class="bad" data-rv="${x.user_id}">Révoquer</button></div>`).join('') || '<p class="card mut">Aucun ambassadeur.</p>'}
  <form id="bf" class="card"><b>Abonnement fournisseur payé</b><label>Fournisseur<select name="supplier_id" required>${S.map(s => `<option value="${s.id}">${esc(s.display_name)}</option>`).join('')}</select></label>
  <label>Montant (FCFA)<input name="amount" type="number" min="1" required></label><label>Référence du paiement<input name="reference" required></label><button class="full">Enregistrer l’abonnement (1 an)</button></form>
  <h2>Demandes des membres (${L.filter(x => x.status === 'new').length} nouvelles)</h2>
  ${L.map(x => `<div class="card"><b>${esc(x.products?.title)}</b> <span class="tag">${{contact:'Contact', buy:'Achat', promote:'Promotion'}[x.kind]}</span><span class="tag s">${esc(x.status)}</span><br>
   <span class="mut">${esc(x.profiles?.full_name)} · ${esc(x.profiles?.phone)}</span><p>${esc(x.message || '')}</p>
   ${x.status === 'new' ? `<button data-d="validated" data-i="${x.id}">Valider</button><button class="bad" data-d="refused" data-i="${x.id}">Refuser</button>` : ''}</div>`).join('') || '<p class="card mut">Aucune demande.</p>'}
  <h2>Nouveau fournisseur</h2><form id="sf" class="card"><label>Nom affiché (public)<input name="display_name" required></label>
  <label>Nom réel (privé)<input name="real_name"></label><label>Téléphone (privé)<input name="phone"></label>
  <label>Catégorie<input name="category"></label><label>Ville<input name="city"></label>
  <label>Recruté par (ambassadeur ou candidat)<select name="referred_by"><option value="">—</option>${M.map(m => `<option value="${m.id}">${esc(m.full_name)} ${esc(m.phone || '')}</option>`).join('')}</select></label>
  <label>WhatsApp (privé)<input name="whatsapp"></label>
  <label><input name="certified" type="checkbox" style="width:auto"> Fournisseur certifié</label><button class="full">Créer le fournisseur</button></form>
  <h2>Nouveau produit</h2><form id="pf" class="card"><label>Fournisseur<select name="supplier_id" required>${S.map(s => `<option value="${s.id}">${esc(s.display_name)}</option>`).join('')}</select></label>
  <label>Titre<input name="title" required></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Catégorie<input name="category"></label>
  <label>Prix (FCFA)<input name="price" type="number" min="0" required></label><label>Commission annoncée (FCFA)<input name="commission" type="number" min="0"></label>
  <label>Disponibilité<select name="availability"><option value="unconfirmed">À confirmer</option><option value="in_stock">En stock</option><option value="limited">Stock limité</option><option value="out_of_stock">Rupture</option></select></label>
  <label>Statut<select name="status"><option value="draft">Brouillon</option><option value="active">Publié</option></select></label><button class="full">Créer le produit</button></form>
  <h2>Produits (${P.length})</h2>${P.map(x => `<div class="card row"><span><b>${esc(x.title)}</b><br><span class="mut">${esc(x.suppliers?.display_name)} · ${fcfa(x.price)}</span></span>
   <button class="alt" data-p="${x.id}" data-s="${x.status === 'active' ? 'inactive' : 'active'}">${x.status === 'active' ? 'Retirer' : 'Publier'}</button></div>`).join('')}`;
  const go = async f => { try { await f(); adminCentrale(); } catch (_) {} };
  document.getElementById('sf').onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); go(async () => {
    const s = await q(sb.from('suppliers').insert({display_name:f.display_name.trim(), category:f.category.trim() || null, city:f.city.trim() || null, certified:f.certified === 'on', referred_by:f.referred_by || null}).select('id').single());
    if (f.real_name || f.phone || f.whatsapp) await q(sb.from('supplier_private').insert({supplier_id:s.id, real_name:f.real_name.trim() || null, phone:f.phone.trim() || null, whatsapp:f.whatsapp.trim() || null})); toast('Fournisseur créé.'); }); };
  document.getElementById('pf').onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); go(async () => {
    await q(sb.from('products').insert({supplier_id:f.supplier_id, title:f.title.trim(), description:f.description.trim(), category:f.category.trim() || null, price:Number(f.price),

    go(() => q(sb.rpc('decide_lead', {p_lead_id:b.dataset.i, p_decision:b.dataset.d, p_note:note}))); });
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { let why = null; if (b.dataset.r === 'rejected') { why = prompt('Motif du refus ?'); if (!why) return; }
    go(() => q(sb.rpc('admin_review_product', {p_id:b.dataset.i, p_decision:b.dataset.r, p_reason:why}))); });
  app.querySelectorAll('[data-rv]').forEach(b => b.onclick = () => { if (confirm('Révoquer ce statut d’ambassadeur ?')) go(() => q(sb.rpc('admin_revoke_ambassador', {p_user_id:b.dataset.rv}))); });
  document.getElementById('bf').onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    go(async () => { await q(sb.from('supplier_subscriptions').insert({supplier_id:f.supplier_id, amount:Number(f.amount), reference:f.reference.trim()})); toast('Abonnement enregistré.'); }); };
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => go(() => q(sb.from('products').update({status:b.dataset.s}).eq('id', b.dataset.p))));
}

// ===== src/pages/ambassador.js =====
const AVL = {in_stock:'En stock', limited:'Stock limité', out_of_stock:'Rupture', unconfirmed:'À confirmer'};
const PST = {pending:'En attente de validation', active:'Publié', rejected:'Refusé', inactive:'Retiré', draft:'Brouillon'};
async function ambassador() {
  if (!state.isAmbassador) { app.innerHTML = '<a href="#/profile">← Profil</a><p class="card">Espace réservé aux ambassadeurs actifs.</p>'; return; }
  const [sp, pr, ld] = await Promise.all([sb.from('suppliers').select('*').eq('created_by', state.me.id).order('created_at', {ascending:false}),
    sb.from('products').select('*,suppliers(display_name)').eq('created_by', state.me.id).order('created_at', {ascending:false}),
    sb.from('product_leads').select('*,products(title)').eq('ambassador_id', state.me.id).order('created_at', {ascending:false}).limit(60)]);
  const S = sp.data || [], P = pr.data || [], L = ld.data || [];
  app.innerHTML = `<a href="#/centrale">← La Centrale</a><h1>Espace ambassadeur</h1>
  <h2>Demandes reçues (${L.filter(x => x.status === 'new').length} à traiter)</h2>
  ${L.map(x => `<div class="card" data-l="${x.id}"><b>${esc(x.products?.title)}</b> <span class="tag">${{contact:'Contact', buy:'Achat', promote:'Promotion'}[x.kind]}</span><span class="tag s">${{new:'En attente', validated:'Validée', refused:'Refusée'}[x.status]}</span>
   <p class="mut who">…</p><p>${esc(x.message || '')}</p>${x.status === 'new' ? `<button data-d="validated" data-i="${x.id}">Valider</button><button class="bad" data-d="refused" data-i="${x.id}">Refuser</button>` : ''}</div>`).join('') || '<p class="card mut">Aucune demande.</p>'}
  <h2>Mes fiches fournisseurs</h2>${S.map(s => `<div class="card">${esc(s.display_name)} <span class="mut">${esc(s.category || '')} ${esc(s.city || '')}</span></div>`).join('') || '<p class="card mut">Aucune fiche.</p>'}
  <form id="sf" class="card"><b>Nouvelle fiche fournisseur</b><label>Nom affiché (public, unique)<input name="display_name" required></label><label>Nom réel (privé)<input name="real_name"></label>
  <label>Téléphone (privé)<input name="phone" type="tel"></label><label>WhatsApp (privé)<input name="whatsapp" type="tel"></label><label>Catégorie<input name="category"></label><label>Ville<input name="city"></label>
  <button class="full">Créer la fiche</button></form>
  <h2>Mes produits</h2>${P.map(x => `<div class="card"><b>${esc(x.title)}</b> <span class="tag s">${PST[x.status]}</span><br><span class="mut">${esc(x.suppliers?.display_name)} · ${fcfa(x.price)}</span>
   ${x.status === 'rejected' && x.review_note ? `<p class="mut">Motif : ${esc(x.review_note)}</p>` : ''}
   ${x.status === 'active' ? `<select data-a="${x.id}">${Object.entries(AVL).map(([v, l]) => `<option value="${v}" ${x.availability === v ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}</div>`).join('') || '<p class="card mut">Aucun produit.</p>'}
  <form id="pf" class="card"><b>Publier un produit</b><label>Fournisseur<select name="supplier_id" required>${S.map(s => `<option value="${s.id}">${esc(s.display_name)}</option>`).join('')}</select></label>
  <label>Titre<input name="title" required></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Catégorie<input name="category"></label>
  <label>Prix (FCFA)<input name="price" type="number" min="0" required></label><label>Commission annoncée (FCFA)<input name="commission" type="number" min="0"></label>
  <label>Disponibilité<select name="availability"><option value="unconfirmed">À confirmer</option><option value="in_stock">En stock</option><option value="limited">Stock limité</option><option value="out_of_stock">Rupture</option></select></label>
  <button class="full">Envoyer pour validation</button><p class="mut">Le produit sera visible après validation par l’administration.</p></form>`;
  const go = async f => { try { await f(); ambassador(); } catch (_) {} };
  L.forEach(async x => { const w = await sb.rpc('lead_requester', {p_lead_id:x.id}), d = w.data?.[0], el = app.querySelector(`[data-l="${x.id}"] .who`);
    if (el) el.textContent = d ? `${d.full_name} · ${d.phone || ''} · ${d.city || ''}` : ''; });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { let note = null;
    if (b.dataset.d === 'refused') { note = prompt('Motif du refus (facultatif) ?'); if (note === null) return; }
    go(() => q(sb.rpc('decide_lead', {p_lead_id:b.dataset.i, p_decision:b.dataset.d, p_note:note}))); });
  app.querySelectorAll('[data-a]').forEach(s => s.onchange = () => go(() => q(sb.rpc('ambassador_set_availability', {p_product_id:s.dataset.a, p_availability:s.value}))));
  document.getElementById('sf').onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    go(async () => { const x = await sb.from('suppliers').insert({display_name:f.display_name.trim(), category:f.category.trim() || null, city:f.city.trim() || null}).select('id').single();
      if (x.error) { toast(x.error.code === '23505' ? 'Ce nom de fiche existe déjà : choisissez-en un autre.' : x.error.message); throw x.error; }
      if (f.real_name || f.phone || f.whatsapp) await q(sb.from('supplier_private').insert({supplier_id:x.data.id, real_name:f.real_name.trim() || null, phone:f.phone.trim() || null, whatsapp:f.whatsapp.trim() || null}));
      toast('Fiche créée.'); }); };
  document.getElementById('pf').onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    go(async () => { await q(sb.from('products').insert({supplier_id:f.supplier_id, title:f.title.trim(), description:f.description.trim(), category:f.category.trim() || null,
      price:Number(f.price), commission:f.commission === '' ? null : Number(f.commission), availability:f.availability, status:'pending'})); toast('Produit envoyé pour validation.'); }); };
}

// ===== src/main.js =====
const ROUTES = {'':home, community, publish, contacts, activity, wallet, profile, admin:a => a === 'centrale' ? adminCentrale() : admin(), p:detail, m:soon, centrale, product, immobilier, transport, ambassador};

async function route() {
  if (!state.me) return authView(boot);
  setNav();
  const [, k = '', a, b] = (location.hash || '#/').split('/');
  if (k === 'admin' && !state.isAdmin) { app.innerHTML = '<p class="card">Accès refusé : réservé aux administrateurs.</p>'; return; }
  const fn = ROUTES[k];
  if (!fn) { app.innerHTML = '<p class="card">Page introuvable.</p>'; return; }
  loading();
  try { await fn(a, b); }
  catch (_) { app.innerHTML = '<p class="card">Impossible de charger cet écran. Vérifiez votre connexion puis réessayez.</p>'; }
}
async function boot() { const s = await loadSession(); state.me = s.user; state.isAdmin = s.admin; state.isAmbassador = s.amb; route(); }

window.addEventListener('hashchange', route);
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.me = null; state.isAdmin = false; route(); } });
boot();
</script>
