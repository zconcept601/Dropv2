<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2455F4">
<title>La Centrale — Démo DropAffy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F3F5FB; --surface:#fff; --ink:#0B1530; --mut:#66728A; --line:#E4E9F4;
  --brand:#2455F4; --brand2:#5B7CFF; --tint:#E8EEFF; --sun:#FFB020;
  --ok:#12A150; --bad:#D92D3A; --warn:#8A5A00;
  --sh:0 1px 2px rgba(11,21,48,.05),0 10px 28px rgba(11,21,48,.07);
}
@media(prefers-color-scheme:dark){:root{--bg:#0A0F1F;--surface:#121A33;--ink:#EEF2FF;--mut:#97A3C2;--line:#1F2A4A;--tint:#1A2650;--brand:#5B7CFF;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:radial-gradient(900px 380px at 50% -140px,#cfdcff55,transparent),var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:90px}
a{color:var(--brand);text-decoration:none}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
main{max-width:1000px;margin:0 auto;padding:20px 16px}
h1{font-size:1.85rem;letter-spacing:-.025em;margin:6px 0 16px;font-weight:800;line-height:1.15}
h2{font-size:1.15rem;margin:26px 0 12px;font-weight:800;letter-spacing:-.01em}
h3{font-size:.95rem;margin:18px 0 8px;font-weight:800}
.mut{color:var(--mut);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;box-shadow:var(--sh)}
a.card{display:block;color:inherit;text-decoration:none;transition:transform .12s}
a.card:active{transform:scale(.985)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:700px){.grid3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tint);color:var(--brand);margin-right:6px}
.tag.s{background:#FFF1D1;color:var(--warn)}
.tag.ok{background:#DCFCE7;color:#14532D}
.tag.bad{background:#FEE2E2;color:#991B1B}
.btn{font:inherit;font-weight:700;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:12px 18px;margin:4px 8px 4px 0;display:inline-block;text-decoration:none;text-align:center;box-shadow:0 8px 18px rgba(36,85,244,.28)}
.btn.alt{background:var(--surface);color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.btn.bad{background:var(--bad);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:none}
.btn.full{display:block;width:100%;margin:6px 0}
.btn.sm{padding:8px 14px;font-size:.85rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
input,textarea,select{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:6px 0 12px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px #2455F428}
label{display:block;font-weight:600;font-size:.85rem;color:var(--mut)}
.hero{position:relative;overflow:hidden;border:0;border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,#1738C9,#2455F4 55%,#6D8BFF);box-shadow:0 18px 40px rgba(36,85,244,.35);margin-bottom:14px}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#ffffff40,transparent 70%)}
.hero small{opacity:.85;font-weight:600}.hero b{display:block;font-size:2.2rem;font-weight:800;letter-spacing:-.03em;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.stat{text-align:left}
.stat b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.stat span{font-size:.8rem;color:var(--mut)}
.chips{display:flex;overflow-x:auto;gap:6px;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;flex-shrink:0}
.thumb{width:100%;aspect-ratio:16/10;background:var(--tint);border-radius:12px;display:grid;place-items:center;color:var(--mut);font-size:.78rem;margin-bottom:8px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{font-weight:600}
.gallery{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.gallery div{flex:0 0 96px;aspect-ratio:1;background:var(--tint);border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:.7rem;color:var(--mut)}
.gallery div img{width:100%;height:100%;object-fit:cover;display:block}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block;margin-right:6px}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:24px;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(11,21,48,.18);z-index:20}
@media(prefers-color-scheme:dark){nav{background:rgba(18,26,51,.85)}}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:18px;color:var(--mut);font-size:.68rem;font-weight:700}
nav a.on{background:var(--tint);color:var(--brand)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:30;max-width:92%;font-weight:600;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(11,21,48,.45);display:grid;place-items:center;padding:16px;z-index:25}
.modal{background:var(--surface);border-radius:22px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(11,21,48,.3);max-height:88vh;overflow-y:auto}
.modal h2{margin:0 0 8px}
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
.kpi span{font-size:.75rem;color:var(--mut)}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.4;margin-bottom:10px;opacity:.5}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 14px;border-radius:12px;color:var(--mut);font-weight:700;font-size:.85rem;white-space:nowrap;background:transparent}
.tabs a.on{background:var(--tint);color:var(--brand)}
.demo-badge{display:inline-block;font-size:.68rem;font-weight:800;background:#FEF3C7;color:#92400E;padding:2px 8px;border-radius:6px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em;vertical-align:middle}
.quota-bar{height:14px;background:var(--tint);border-radius:8px;overflow:hidden;margin:8px 0}
.quota-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s}
.supplier-avatar{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.stars{color:var(--sun);letter-spacing:1px;font-size:.85rem}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .body{flex:1;min-width:0}
.list-item .body b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .body span{font-size:.78rem;color:var(--mut)}
</style>
</head>

// ===== STATE =====
const S = {
  me: { name:'Abdoulaye', affiliations_active: 1 },
  route: location.hash || '#/centrale',
  leads: [],           // initialisé depuis DATA.initialLeads
  // filtres catalogue
  q:'', cat:'', sort:'new', limit:6,
  modal:null
};
function loadLeads(){
  try{
    const s = localStorage.getItem('centrale_leads');
    if (s) return JSON.parse(s);
  }catch(_){}
  return DATA.initialLeads.map(x=>({...x}));
}
function saveLeads(){
  try{ localStorage.setItem('centrale_leads', JSON.stringify(S.leads)); }catch(_){}
}
S.leads = loadLeads();
function pushLead(lead){
  lead.id = 'l' + Date.now();
  lead.created_at = Date.now();
  lead.status = 'new';
  lead.note = null;
  S.leads.push(lead);
  saveLeads();
}

// ===== UTILS =====
const fcfa = n => new Intl.NumberFormat('fr-FR').format(n||0) + ' FCFA';
const dt = d => new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 3000);
}
function openModal(html){
  closeModal();
  const bg = document.createElement('div');
  bg.className = 'modal-bg'; bg.id = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if(e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  // Focus trap simple
  const m = bg.querySelector('.modal');
  const f = m.querySelector('input,textarea,select,button,a');
  if (f) setTimeout(()=>f.focus(), 30);
}
function closeModal(){
  const bg = document.getElementById('modal-bg');
  if (bg) bg.remove();
}
function getProduct(id){ return DATA.products.find(p=>p.id===id); }
function getSupplier(id){ return DATA.suppliers.find(s=>s.id===id); }
function leadsFor(productId){
  return S.leads.filter(l => l.product_id === productId);
}
function affilStatus(){
  // retourne {active, pending, refused} pour ce membre
  const mine = S.leads.filter(l=>l.kind==='promote');
  return {
    active: mine.filter(l=>l.status==='validated').length,
    pending: mine.filter(l=>l.status==='new').length,
    refused: mine.filter(l=>l.status==='refused').length
  };
}

const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||''}</svg>`;

// ===== LAYOUT =====
const NAV = [
  ['#/centrale','Centrale','store'],
  ['#/centrale/catalogue','Catalogue','grid'],
  ['#/centrale/affiliation','Affiliations','link'],
  ['#/centrale/ventes','Ventes','chart'],
  ['#/centrale/admin','Admin','cog']
];
function renderNav(){
  const h = location.hash || '#/centrale';
  document.getElementById('nav').innerHTML = NAV.map(([u,l,i])=>{
    const on = h === u || (u==='#/centrale' && h==='#/centrale');
    return `<a href="${u}" class="${on?'on':''}">${icon(i)}${l}</a>`;
  }).join('');

function pageCatalogue(params){
  const q = params.q || S.q;
  const cat = params.cat || S.cat;
  const sort = params.sort || S.sort;
  let list = DATA.products.slice();
  if (cat) list = list.filter(p=>p.category===cat);
  if (q) { const n = q.toLowerCase(); list = list.filter(p=>p.title.toLowerCase().includes(n)||p.category.toLowerCase().includes(n)||p.description.toLowerCase().includes(n)); }
  if (sort==='price_asc') list.sort((a,b)=>a.price-b.price);
  else if (sort==='price_desc') list.sort((a,b)=>b.price-a.price);
  else if (sort==='commission_desc') list.sort((a,b)=>b.commission-a.commission);
  else list.reverse();

  const limited = list.slice(0, S.limit);
  return `
  <a class="btn alt sm" href="#/centrale">${icon('back')} Retour</a>
  <h1>Catalogue</h1>
  <form id="cat-search" class="card">
    <label>Rechercher</label>
    <div class="row">
      <input id="cs" type="search" placeholder="Nom, catégorie…" value="${esc(q)}" style="margin:0">
      <button class="btn" type="submit">Chercher</button>
    </div>
  </form>
  <div class="row" style="margin-bottom:8px">
    <select id="sortby" style="margin:0;flex:1">
      <option value="new" ${sort==='new'?'selected':''}>Plus récents</option>
      <option value="price_asc" ${sort==='price_asc'?'selected':''}>Prix croissant</option>
      <option value="price_desc" ${sort==='price_desc'?'selected':''}>Prix décroissant</option>
      <option value="commission_desc" ${sort==='commission_desc'?'selected':''}>Meilleure commission</option>
    </select>
  </div>
  <div class="chips">
    <a class="btn sm ${!cat?'':'alt'}" href="#/centrale/catalogue${q?'?q='+encodeURIComponent(q):''}">Toutes</a>
    ${DATA.categories.map(c=>`<a class="btn sm ${cat===c?'':'alt'}" href="#/centrale/catalogue?cat=${encodeURIComponent(c)}${q?'&q='+encodeURIComponent(q):''}">${esc(c)}</a>`).join('')}
  </div>

  ${list.length===0?`
    <div class="empty">
      ${icon('search')}
      <h3>Aucun produit trouvé</h3>
      <p class="mut">Essayez un autre mot-clé ou retirez les filtres.</p>
      <a class="btn alt" href="#/centrale/catalogue">Réinitialiser</a>
    </div>`:`
    <p class="mut">${list.length} produit(s) · affichés : ${limited.length}</p>
    <div class="grid">${limited.map(productCard).join('')}</div>
    ${list.length > limited.length ? `<button class="btn full" id="more">Charger plus</button>`:''}
  `}`;
}

    ${DATA.categories.map(c=>`<div class="list-item"><div class="body"><b>${esc(c)}</b></div><span class="mut">${DATA.products.filter(p=>p.category===c).length} produits</span></div>`).join('')}</div>`;
  }
  if (tab==='demandes') {
    return `<b>Demandes reçues</b>` + DATA.incoming.map(d=>{
      const p = getProduct(d.product_id);
      return `<div class="card">
        <div class="row"><div><b>${esc(d.user)}</b><br><span class="mut">${esc(p?.title||'')} · ${dt(d.date)}</span></div>
        <span class="tag ${d.status==='new'?'s':d.status==='validated'?'ok':'bad'}">${{new:'Nouvelle',validated:'Validée',refused:'Refusée'}[d.status]}</span></div>
        <p class="mut">${esc(d.message)}</p>
        ${d.status==='new'?`<div class="row"><button class="btn sm ok" data-req="validated" data-id="${d.id}">Accepter</button><button class="btn sm bad" data-req="refused" data-id="${d.id}">Refuser</button></div>`:''}
      </div>`;
    }).join('');
  }
  if (tab==='affiliations') {
    return `<b>Affiliations en cours</b>` + S.leads.filter(l=>l.kind==='promote').map(l=>{
      const p = getProduct(l.product_id);
      return `<div class="card"><b>${esc(p?.title||'')}</b> · <span class="tag ${l.status==='validated'?'ok':l.status==='refused'?'bad':'s'}">${{new:'En attente',validated:'Active',refused:'Refusée'}[l.status]}</span></div>`;
    }).join('');
  }
  if (tab==='ventes') {
    return `<b>Ventes</b>` + DATA.sales.map(s=>{
      const p = getProduct(s.product_id);
      return `<div class="card row"><div><b>${esc(p?.title||'')}</b><br><span class="mut">${dt(s.date)}</span></div>
        <span class="tag ${s.status==='paid'?'ok':s.status==='validated'?'':'s'}">${{pending:'En attente',validated:'Validée',paid:'Payée'}[s.status]}</span></div>`;
    }).join('');
  }
  if (tab==='quotas') {
    return `<b>Quotas fournisseurs</b><p class="mut">Abonnement : 3 000 FCFA/mois · 20 contacts gratuits · puis tranches de 10 contacts à 100 FCFA.</p>
    ${DATA.suppliers.map(s=>{
      const q = DATA.quotas[s.id]||{used:0,paid:0};
      const usedPct = Math.min(100, Math.round(q.used/40*100));
      return `<div class="card">
        <div class="row"><b>${esc(s.name)}</b><span class="tag ${q.next_needs_pay?'s':''}">${q.used}/40 contacts</span></div>
        <div class="quota-bar"><i style="width:${usedPct}%"></i></div>
        <p class="mut">Tranches payées : ${q.paid} · ${q.next_needs_pay?'<b>Paiement 100 FCFA requis pour la prochaine tranche</b>':'Prochain contact gratuit ou déjà couvert'}</p>
      </div>`;
    }).join('')}`;
  }
  if (tab==='historique') {
    return `<b>Historique</b>
    ${[
      {date:Date.now()-3600000, txt:'Nouveau produit ajouté · TV LED 43"'},
      {date:Date.now()-7200000, txt:'Demande d\'affiliation acceptée · Fatou O.'},
      {date:Date.now()-86400000, txt:'Fournisseur certifié · ÉlectroPlus'},
      {date:Date.now()-172800000, txt:'Abonnement enregistré · TechStore BF'}
    ].map(x=>`<div class="card row"><div><b>${esc(x.txt)}</b><br><span class="mut">${dt(x.date)}</span></div></div>`).join('')}`;
  }
  return '';
}

    <label>Message (facultatif)</label>
    <textarea id="mc-msg" rows="3" placeholder="Précisez votre besoin…"></textarea>

      <button class="btn" id="mc-go">Envoyer la demande</button>

// ===== ROUTER =====
function parseHash(){
  const h = location.hash || '#/centrale';
  const [path, qs] = h.split('?');
  const parts = path.replace(/^#\//,'').split('/');  // ['centrale', ...]
  const params = new URLSearchParams(qs||'');
  return {parts, params};
}

function route(){
  const {parts, params} = parseHash();
  if (parts[0] !== 'centrale') {
    location.hash = '#/centrale'; return;
  }
  const app = document.getElementById('app');
  let html = '';
  if (parts.length===1) html = pageAccueil();
  else if (parts[1]==='catalogue') html = pageCatalogue({q:params.get('q')||'', cat:params.get('cat')||'', sort:params.get('sort')||'new'});
  else if (parts[1]==='produit') html = pageProduit(parts[2]);
  else if (parts[1]==='affiliation') html = pageAffiliation();
  else if (parts[1]==='ventes') html = pageVentes();
  else if (parts[1]==='demandes') html = pageDemandes();
  else if (parts[1]==='admin') html = pageAdmin();
  else html = `<p class="card">Page introuvable.</p>`;

  app.innerHTML = html;
  renderNav();
  attachHandlers();
}

function attachHandlers(){
  // Modals close
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick = closeModal);

  // Home search
  const hs = document.getElementById('home-search');
  if (hs) hs.onsubmit = e => { e.preventDefault();
    const v = document.getElementById('hs').value.trim();
    location.hash = '#/centrale/catalogue' + (v?'?q='+encodeURIComponent(v):'');
  };

  // Catalogue search
  const cs = document.getElementById('cat-search');
  if (cs) cs.onsubmit = e => { e.preventDefault();
    const v = document.getElementById('cs').value.trim();
    location.hash = '#/centrale/catalogue' + (v?'?q='+encodeURIComponent(v):'');
  };
  const sb = document.getElementById('sortby');
  if (sb) sb.onchange = () => {
    const v = sb.value;
    const url = new URL(location.href);
    url.hash = '#/centrale/catalogue?sort=' + v;
    location.href = url.href;
  };
  const more = document.getElementById('more');
  if (more) more.onclick = () => { S.limit += 6; route(); };

  // Actions sur produit
  document.querySelectorAll('[data-action]').forEach(b=>{
    b.onclick = () => {
      const id = location.hash.split('/')[3];
      if (b.dataset.action==='contact') modalContact(id);
      else if (b.dataset.action==='buy') modalBuy(id);
      else if (b.dataset.action==='promote') modalPromote(id);
    };
  });

  // Accepter/refuser une demande reçue
  document.querySelectorAll('[data-req]').forEach(b=>{
    b.onclick = () => {
      const id = b.dataset.id, st = b.dataset.req;
      const req = DATA.incoming.find(x=>x.id===id);
      if (req) req.status = st;
      toast('Demande ' + (st==='validated'?'validée':'refusée') + ' (simulation)');
      route();
    };
  });

  // Espace affiliation : simuler acceptation/refus
  document.querySelectorAll('[data-lead]').forEach(b=>{
    b.onclick = () => {
      const id = b.dataset.id, st = b.dataset.lead;
      const l = S.leads.find(x=>x.id===id);
      if (l) { l.status = st; saveLeads(); }
      toast(st==='validated'?'Demande acceptée (simulation)':'Demande refusée (simulation)');
      route();
    };
  });

  // Admin : nouvelle fiche / produit
  document.querySelectorAll('[data-new]').forEach(b=>{
    b.onclick = () => {
      if (b.dataset.new==='product') openModalProductForm();
      if (b.dataset.new==='supplier') openModalSupplierForm();
    };
  });
  document.querySelectorAll('[data-edit]').forEach(b=>{
    b.onclick = () => {
      const p = getProduct(b.dataset.edit);
      openModalProductForm(p);
    };
  });
  document.querySelectorAll('[data-gallery]').forEach(b=>{
    b.onclick = () => modalGallery(b.dataset.gallery);
  });
  document.querySelectorAll('[data-view-supplier]').forEach(b=>{
    b.onclick = () => {
      const s = getSupplier(b.dataset.viewSupplier);
      openModal(`<h2>${esc(s.name)}</h2>
        <p class="mut">${esc(s.category)} · ${esc(s.city)}</p>
        ${s.certified?'<p><span class="tag ok">Fournisseur certifié</span></p>':''}
        <hr class="hr">
        <p><b>Téléphone (privé)</b><br>${esc(s.phone)}</p>
        <p class="mut" style="font-size:.8rem">Ces informations sont confidentielles et accessibles uniquement aux administrateurs.</p>
        <p><b>Produits (${s.products.length})</b></p>
        ${s.products.map(pid=>{const p=getProduct(pid); return `<div class="list-item"><div class="body"><b>${esc(p.title)}</b><span>${fcfa(p.price)}</span></div></div>`}).join('')}
        <button class="btn full" data-close>Fermer</button>`);
    };
  });
}

function openModalProductForm(p){
  const isEdit = !!p;
  openModal(`
    <h2>${isEdit?'Modifier le produit':'Nouveau produit'}</h2>
    <label>Titre</label><input id="fp-title" value="${p?esc(p.title):''}">
    <label>Catégorie</label>
    <select id="fp-cat">${DATA.categories.map(c=>`<option ${p&&p.category===c?'selected':''}>${c}</option>`).join('')}</select>
    <label>Prix (FCFA)</label><input id="fp-price" type="number" value="${p?p.price:''}">
    <label>Commission (FCFA)</label><input id="fp-com" type="number" value="${p?p.commission:''}">
    <label>Description</label><textarea id="fp-desc" rows="3">${p?esc(p.description):''}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn alt" data-close>Annuler</button>
      <button class="btn" id="fp-go">${isEdit?'Enregistrer':'Créer'}</button>
    </div>
  `);
  document.getElementById('fp-go').onclick = () => {
    toast(isEdit?'Produit modifié (simulation)':'Produit créé (simulation)');
    closeModal();
  };
}
function openModalSupplierForm(){
  openModal(`
    <h2>Nouveau fournisseur</h2>
    <label>Nom affiché</label><input id="fs-name">
    <label>Catégorie</label>
    <select id="fs-cat">${DATA.categories.map(c=>`<option>${c}</option>`).join('')}</select>
    <label>Ville</label><input id="fs-city">
    <label>Nom réel (privé)</label><input id="fs-real">
    <label>Téléphone (privé)</label><input id="fs-phone" type="tel">
    <label><input type="checkbox" id="fs-cert" style="width:auto"> Fournisseur certifié</label>
    <div class="row" style="margin-top:10px">
      <button class="btn alt" data-close>Annuler</button>
      <button class="btn" id="fs-go">Créer</button>
    </div>
  `);
  document.getElementById('fs-go').onclick = () => {
    toast('Fournisseur créé (simulation)');
    closeModal();
  };
}

// ===== BOOT =====
window.addEventListener('hashchange', route);
if (!location.hash || location.hash==='#/' || !location.hash.startsWith('#/centrale')) {
  location.hash = '#/centrale';
}
route();
</script>
